// Shared build logic for every per-Minecraft-version subproject under versions/.
// Each subproject declares its own `plugins {}` block (required at the top of its own
// build.gradle — can't live in an applied script) and its own gradle.properties with the
// version-specific coordinates (minecraft_version, yarn_mappings, loader_version,
// fabric_api_version, cloth_config_version, mod_menu_version), then applies this for
// everything else.

repositories {
	maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

// Code and resources shared by every Minecraft version live in /shared, not per-version.
sourceSets {
	main {
		java { srcDir rootProject.file('shared/src/main/java') }
		resources { srcDir rootProject.file('shared/src/main/resources') }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Config screen — required mod dependency, same as Fabric API; not bundled.
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// Mod Menu entry point — optional, only used if the player already has it installed.
	modCompileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
	def modVersion = rootProject.property('mod_version')
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

def projectNameForJar = project.name
jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${projectNameForJar}" }
	}
}

base {
	archivesName = "chatping-mc${project.minecraft_version}"
}
version = rootProject.property('mod_version')
group = rootProject.property('mod_group')

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}
