// This root project has no source of its own — see versions/1.21.1 and versions/1.21.11.
// `./gradlew build` builds every version; `./gradlew :versions:1.21.11:build` builds just one.

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds every Minecraft-version jar.'
	dependsOn subprojects.collect { it.tasks.named('build') }
}
